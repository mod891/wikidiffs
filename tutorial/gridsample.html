<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            pagina grid
        </title>
        <link rel="stylesheet" href="../css/bg-colors.css">
        <style>
            .content {
                width:min-content;
            }
            .grid-3x3 {
                display: grid;
                
                grid-template-areas:
                    "A B C"
                    "D E F"
                    "G H I";
            }
            .grid-2x4x1 {
                display: grid;
                font-weight: bold;
                grid-template-areas:
                    "B G F H"
                    "A C D E"
                    "I I I I";
            }
           
            /* assign areas */
            #A { grid-area: A; }
            #B { grid-area: B; }
            #C { grid-area: C; }
            #D { grid-area: D; }
            #E { grid-area: E; }
            #F { grid-area: F; }
            #G { grid-area: G; }
            #H { grid-area: H; }
            #I { grid-area: I; }
            
            .box {
                width: 100px;
                height: 100px;
                margin: 0.5rem;
                line-height: 100px; /* texto centrado vertical    */
                text-align: center; /* texto centrado horizontal  */  
            }
            
        </style>
    </head>
    <body>
        <div class="content">
            <div id="grid-sample1" class="grid-3x3">
                <div class=""> <!-- COLUMNA1 -->
                    <div id="A" class="box bg-red">A</div>
                    <div id="B" class="box bg-blue">B</div>
                    <div id="C" class="box bg-green">C</div>
                </div>
                <div class=""> <!-- COLUMNA2 -->
                     <div id="D" class="box bg-yellow">D</div>
                    <div id="E" class="box bg-purple">E</div>
                    <div id="F" class="box bg-cyan">F</div>
                </div>
                <div class=""> <!-- COLUMNA3 -->
                    <div id="G" class="box bg-orange">G</div>
                    <div id="H" class="box bg-green2">H</div>
                    <div id="I" class="box bg-gold">I</div>
                </div>
            </div>
            <hr>
             <div id="grid-sample2" class="grid-3x3">
                <!-- FILA1 -->
                <div id="A" class="box bg-red">A</div>
                <div id="B" class="box bg-blue">B</div>
                <div id="C" class="box bg-green">C</div>
                <!-- FILA2 -->
                <div id="D" class="box bg-yellow">D</div>
                <div id="E" class="box bg-purple">E</div>
                <div id="F" class="box bg-cyan">F</div>
                <!-- FILA3 -->
                <div id="G" class="box bg-orange">G</div>
                <div id="H" class="box bg-green2">H</div>
                <div id="I" class="box bg-gold">I</div>
            </div>
            <hr>
            <div id="grid-sample3" class="grid-2x4x1">
                <div id="A" class="box bg-red">A</div>
                <div id="B" class="box bg-blue">B</div>
                <div id="C" class="box bg-green">C</div>
                <div id="D" class="box bg-yellow">D</div>
                <div id="E" class="box bg-purple">E</div>
                <div id="F" class="box bg-cyan">F</div>
                <div id="G" class="box bg-orange">G</div>
                <div id="H" class="box bg-green2">H</div>
                <div id="I" class="box bg-gold">I</div>
            </div>
        </div>
    </body>
</html>
