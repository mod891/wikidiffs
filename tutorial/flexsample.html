<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            pagina flex
        </title>
        <link rel="stylesheet" href="../css/bg-colors.css">
        <style>
            /* list-style: none; rm marker from li's */ 
            .container {
                width: 100%;
                height: 100%;
                /*         position: fixed; /* fixed no afecta al layout */
 */
            }
            .flex-direction-column {
                display: flex;
                flex-direction: column;
                align-items: center; /* funciona solo con columnas? */                
            }
            .flex-direction-row {
                display: flex;
                flex-direction: row;
                justify-content: center; /* funciona solo con filas? */    
            }
            .box {
                width: 100px;
                height: 100px;
                margin: 1rem;
                background-color: red;
            }
        </style>
    </head>
    <body>
        <div id="flex-direction" class="container">
            <div class="flex-direction-column">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="flex-direction-row">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <hr>
        </div>
        
    
        
    </body>
</html>
