<style>

/* BEGIN:SWITCH by CHATGPT */
.switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 25px;
}
.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    background-color: #ccc;
    border-radius: 25px;
    top:0;
    left: 0;
    right: 0;
    bottom: 0;
    transition: 0.3s;
}
.slider:before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 2.5px;
    background-color: white;
    border-radius: 50%;
    transition: 0.3s;
}
input:checked + .slider {
    background-color: cyan;
}
input:checked + .slider:before {
    transform: translateX(25px);
}
/* END:SWITCH by CHATGPT */
input {
    text-align: center;
    width: 100%;
}
#title {
    padding-left:10vw;
}

#filter-inputs {
    display: flex;
    flex-direction: row;

}
#close-modal {
    cursor: pointer; 
    margin: 0rem 0.5rem 0rem 0rem;
    padding: 0.2rem 0.5rem 0rem 0rem;
}
#filter-inputs > div {
    width: 24%;
    justify-content: space-around;
    padding: 0.2rem;
    margin-right: 0.5rem;
    display: flex;
    box-shadow: 2px 2px 5px var(--black);

}
#links {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    justify-content: left;
}
.link {
    margin-right:2rem;
}
.filter-icon {
    padding-top: 10px;
    width:50px;
    height:50px;
    cursor: pointer;
}
.slide-up {
    transition: transform 0.5s ease;
    transform: translateY(-0.5px);        
}
.slide-down {
    transition: transform 0.5s ease;
    transform: translateY(0.0px);        
}
.modal {
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    /* padding-top:10rem; */
    display: none;
    align-items: center;
    justify-content: center;
}
.modal-header {
    /* border: solid 1px black; */
    display: flex;
    align-items: flex-start;
    justify-content:space-between;
    width: 200px;
    background-color: red;
}
@media (max-width: 1400px) and (orientation: landscape), (max-width: 1400px) and (orientation:portrait) {
    .filter-icon {
        padding-top: 20px;
        width:40px;
        height:40px;
    }
    .link {
        margin-right: 1rem;
    }
    #title {
        padding-left:5vw;
    }
    #filter-inputs {
        display: grid;
        grid-template-columns: 100%;
        gap: 10px;
        padding-bottom: 0.5rem;
    }
    #filter-inputs > div {
        width: auto;
        justify-content: space-around;
        padding-left: 0.5rem;
        padding-right: 0.8rem;
        margin-right: 0.5rem;
    }
    #links {
        display: grid;
        grid-template-columns: 1fr;
        justify-content: left;
    }
}

<script>
var urlData = null, filteredUrlData = null;
var storageObj = null;
var urlIds = new Map();
var title = document.getElementById('title'), titleText = "";
var categories = null, listby = null, char = '';
var pagerInput = document.getElementById('currentPageInput');
var currentPage = 0, perPage = 55, totalPages = 0;
var btns = document.getElementById('pager').querySelectorAll('button');
var prevBtn = btns[0], nextBtn = btns[1];
var debounce = null;
var categoryTitles = {
    "politica":"política",
    "deportes":"fútbol/deportes",
    "religion":"religión",
    "hechos_historicos":"hechos históricos",
    "filosofia/ideas":"filosofía/ideas",
    "musica/arte/literatura":"música/arte/literatura"
};
if (getVal.split('category:').length > 1) {
    listby = { 'category': getVal.split('category:')[1] };
    document.getElementById('category-filter-div').remove();
} else 
    listby = getVal;
char = listby?.category != undefined? listby.category : listby;

init();

async function init() {
    freezeGUI('Cargando...');
    var storage = false, urls = [], id = '';
    var filtersIcon = document.getElementById('filter-icon');
    var filtersModal = document.getElementById('filters-modal');
    var closeFiltersModal = document.getElementById('close-modal');
    var switchs = document.querySelectorAll('input[type="checkbox"]');
    var buttonsPager = document.querySelectorAll('button');
    var inputPager =  document.getElementById('currentPageInput');

    categories = JSON.parse(sessionStorage.getItem('categories'));
    if (categories == null) {
        fetchSharedData();
        categories = JSON.parse(sessionStorage.getItem('categories'));
    }
    switchs.forEach(e => {
        e.addEventListener('click',() => {showHideInputFilter(e)});
    });
    filtersIcon.addEventListener('click', (evt) => {
        let {height,y} = evt.target.getBoundingClientRect();
        filtersModal.style.display = "flex";
        filtersModal.style.top = height+y+'px';
    });
    closeFiltersModal.addEventListener('click', () => {
        filtersModal.style.display = "none";
        filtersModal.style.top = '0px';
    });
    buttonsPager.forEach( e => e.addEventListener('click',pager));
    inputPager.addEventListener('input',pager);
    storageObj = JSON.parse(sessionStorage.getItem('listby'));
    if (storageObj != null) {
        if (storageObj[[char]] != undefined) {
            storage = true;
            urlData = storageObj[[char]];
            currentPage = storageObj.pager.page+1;
            if (storageObj.filters.actives.length > 0) {
                for (let i=0; i<storageObj.filters.actives.length; i++) {
                    id = storageObj.filters.actives[i];
                    document.getElementById('switch-'+id).click();
                    if (storageObj.filters[id].ids.length > 1) {
                        if (storageObj.filters[id].ids[0].value.length != '')
                            document.getElementById(storageObj.filters[id].ids[0].id).value = storageObj.filters[id].ids[0].value;
                        if (storageObj.filters[id].ids[1].value.length != '')
                            document.getElementById(storageObj.filters[id].ids[1].id).value = storageObj.filters[id].ids[1].value;
                    }
                    else 
                        document.getElementById(storageObj.filters[id].ids[0].id).value = storageObj.filters[id].ids[0].value;
                }
                filterData();
            }
        }
    }
    if (storage == false) {
        if (listby?.category != undefined)
            urls = await query('urlsByCategory',listby.category);
        else
            urls = await query('urlsStartsWith',listby);
        storageObj = {
            [char]: urls ,
            pager: { 
                page:0,
                perPage:perPage 
            },
            filters:{
                1: { 
                    ids: [
                        { id:'searchUrl', value:'' }
                    ],    
                },
                2: { 
                    ids: [
                        { id:'begin', value:'' },
                        { id:'end', value:'' }
                    ],
                },
                3: {
                    ids: [
                        { id: 'category', value:'' }
                    ]
                },
                4: {
                    ids: [
                        { id: 'searchText', value: '' }
                    ]
                },
                actives: [],
            }
        };
        currentPage = storageObj.pager.page+1;
        sessionStorage.setItem('listby',JSON.stringify(storageObj));
        urlData = urls;
    }
    liLinks();
    freezeGUI(false);
}

function liLinks() {
    var div = document.getElementById('listby-content');
    var urls = [], text="", diff="", nedits=0, li = "";
    if ( listby?.category == undefined ) {
        titleText = `  que empiezan por ${listby}`;
        if (listby == 'discusion')
            titleText = ' Discusiones';
        else if (listby == 'anexo') 
            titleText = ' Anexos';
    } else {
        categoryTitle = char;
        categoryTitle = categoryTitles[categoryTitle] != undefined? categoryTitles[categoryTitle] : categoryTitle;
        titleText = ` páginas con categoría: ${categoryTitle}`;
    }
    urls = filteredUrlData != null ? filteredUrlData : urlData; 
    title.innerText = `${urls.length} ${titleText}`;
    pagerInput.value = currentPage;
    totalPages = Number.parseInt((urls.length/perPage));
    if (String(urls.length/perPage).includes('.'))
        totalPages++;
    document.querySelector('.totalPages').textContent = totalPages;

    var ul = document.createElement('ul');
    ul.id = 'links';
    if (urls.length <= perPage)
        document.getElementById('pager').style.display = 'none';
    else
        document.getElementById('pager').style.display = 'flex';

    if (urls.length > 0) {
        let endFor = currentPage == totalPages? urls.length : storageObj.pager.page*perPage+perPage;
        for (let i=storageObj.pager.page*perPage; i<endFor; i++) {
            text = decodeURIComponent(urls[i].articleUrl.split('/').at(-1)).replaceAll('_',' ');
            diff = `#diffs?diff=${urls[i].articleUrl}`;
            nedits = urls[i].nedits;
            if (urls[i].articleUrlDiffs.length > 0) {
                diff += '&'+urls[i].articleUrlDiffs.join('&');
                if ( urls[i].articleUrlDiffs[urls[i].articleUrlDiffs.length-1].includes('search:'))
                    nedits = urls[i].articleUrlDiffs.length-1;
                else
                    nedits = urls[i].articleUrlDiffs.length;
            } 
            li = `<li
                    data-articleurl="${decodeURIComponent(urls[i].articleUrl.split('/').at(-1))}"
                    data-text="${text}"
                    data-neditions=${urls[i].nedits}
                    data-category="${urls[i].category}" >
                        <div class="link d-mr-2">
                            <a id="${urls[i].articleUrl}" href="${diff}">${text}</a>
                            <label class="n-editions">${nedits}</label>
                            <label class="bg-cyan info d-mr2 bold" onclick="info(event)">?</label>
                        </div>
                    </li>`;
            ul.insertAdjacentHTML('beforeend',li);
        }
    }
    div.appendChild(document.createElement('div'))
    if (div.querySelector('ul') != null)
        div.querySelector('ul').remove()
    div.lastChild.appendChild(ul)
    nextBtn.disabled = currentPage == totalPages? true : false;
    prevBtn.disabled = currentPage == 1? true : false;
}

function showHideInputFilter(input) {
    var elem = '', textOption='', value='';
    var div = document.getElementById('filter-inputs');
    var id = input.id.split('-')[1];
    var rect = document.getElementById(`filter-${id}`);
    let key=Object.keys(urlData)[0];

    if (id == "1") {
        elem = `<div id="filter-switch-1" class="bg-cyan ">
                    <label class="ml05"><b>Artículo</b></label>
                    <input id="searchUrl" type="text" class="mr05 ml05 w70" placeholder="text" value="">
                </div>`;

    } else if (id == "2") {
        elem = `<div id="filter-switch-2" class="bg-yellow ">
                        <label class="ml05 pl03"><b>Ini</b></label>
                        <input  id="begin" type="date" class="mr05 ml05" value="">
                        <label class=""><b>Fin</b></label>
                        <input  id="end" type="date" class="mr05 ml05" value="">
                </div>`;
                        
    } else if (id == "3") {
        elem = `<div id="filter-switch-3" class="bg-red ">
                    <label class="mr05"><b>Categoría</b></label>
                    <select id="category" class="w70 text-center" ><option>Seleccionar</option>`
                for (i in categories)
                    if (urlData.some(obj => obj.category == categories[i]) ) {
                        textOption = categoryTitles[categories[i]] != undefined? categoryTitles[categories[i]]: categories[i];
                        elem += `<option value="${categories[i]}">${textOption}</option>`;
                    }
            elem += `</select></div>`;
    } else {
        elem = `
        <div id="filter-switch-4" class="bg-footer ">
            <label class="ml05"><b>Texto</b></label>
            <input id="searchText" type="text" class="mr05 ml05 w70" placeholder="text" value="">
        </div>`;
    }
    if (input.checked) {
        div.insertAdjacentHTML('beforeend',elem);
        let inputs = div.querySelector(`#filter-switch-${id}`).querySelectorAll('input,select');
        inputs.forEach(elem => {
            if (elem.type == 'date' || elem.type == 'select-one')
                elem.addEventListener('change',filterData);
            else {
                if (elem.id == 'searchText') {
                    elem.addEventListener('input',async (e) => {
                        clearTimeout(debounce);
                        debounce = setTimeout(() => {
                            filterData(e);
                        }, 999);
                    });
                }
                else
                    elem.addEventListener('input',filterData);
            }
        });
        if (rect.classList.contains('slide-down'))
            rect.classList.remove('slide-down');
        rect.classList.add('slide-up');
    } else {
        rect.classList.add('slide-down');
        rect.classList.remove('slide-up');
        let inputs = div.querySelector(`#filter-switch-${id}`).querySelectorAll('input,select');
        inputs.forEach(elem => {
            if (elem.type == 'date' || elem.type == 'select-one')
                elem.removeEventListener('change',filterData);
            else
                elem.removeEventListener('input',filterData);
        });
        storageObj.filters[id].ids.forEach( val => {
            val.value = '';
        });
        document.getElementById(`filter-switch-${id}`).remove();
        filterData();
    }
}

async function filterData(e) {
    filteredUrlData = [];
    var urlDiffs = new Map(), urlIds = new Map(), ids = new Set(); 
    var inds = [], aux = null, diffs = null, obj=null, badJSON = false;
    var beginDate= "", endDate = "", lidates = [], date = null, d,m,y;
    var text = "", textUrl = "", articleUrl = ""; 
    var searchUrlInput = document.getElementById('searchUrl');
    var searchTextInput = document.getElementById('searchText');
    var begin = document.getElementById('begin');
    var end = document.getElementById('end');
    var categorySelect = document.getElementById('category');
    var applySearchUrlFilter = false;
    var applySearchTextFilter = false;
    var applyDateFilter = false;
    var applyCategoryFilter = false;
    var filtersState = storageObj.filters;

    if (searchUrlInput != null) {
        if (searchUrlInput.value != '') {
            applySearchUrlFilter = true;
            storageObj.filters['1'].ids[0].value = searchUrlInput.value;
            storageObj.filters.actives.push('1');
        }
        else {
            storageObj.filters['1'].ids[0].value = '';
            storageObj.filters.actives = storageObj.filters.actives.filter( active => active != '1');
        }
    }
    if (begin != null) {
        if (begin.value != '' || end.value != '') {
            applyDateFilter = true;
            storageObj.filters.actives.push('2');
            if (begin.value != "") {
                    [y,m,d] = begin.value.split('-');
                    beginDate = new Date(y, (Number.parseInt(m)-1), d);
                    storageObj.filters['2'].ids[0].value = begin.value;
            }
            else
                storageObj.filters['2'].ids[0].value = '';

            if (end.value != "") {
                [y,m,d] = end.value.split('-');
                endDate = new Date(y, (Number.parseInt(m)-1), d);
                storageObj.filters['2'].ids[1].value = end.value;
            }
            else
                storageObj.filters['2'].ids[1].value = '';
        }
        else {
            storageObj.filters.actives = storageObj.filters.actives.filter( active => active != '2');
        }
    }
    if (categorySelect != null) {
        if (categorySelect.value != 'Seleccionar') {
            applyCategoryFilter = true;
            storageObj.filters.actives.push('3');
            storageObj.filters['3'].ids[0].value = categorySelect.value;
        } 
        else {
            storageObj.filters['3'].ids[0].value = '';
            storageObj.filters.actives = storageObj.filters.actives.filter( active => active != '3');
        }
    }
    if (searchTextInput != null) {
        if (searchTextInput.value != '') {
            applySearchTextFilter = true;
            storageObj.filters.actives.push('4');
            storageObj.filters['4'].ids[0].value = searchTextInput.value;
        }
        else {
            storageObj.filters['4'].ids[0].value = '';
            storageObj.filters.actives = storageObj.filters.actives.filter( active => active != '4');
        }
        searchTextInput.disabled = true;
    }
    storageObj.filters.actives = [...new Set(storageObj.filters.actives)];
    sessionStorage.setItem('listby',JSON.stringify(storageObj));

    for (let i=0; i<urlData.length; i++) {
        inds.push(i);
        urlData[i].articleUrlDiffs = [];
    }
    for (let i=0; i<urlData.length;i++) {
        let li = urlData[i];
        ids = new Set();

        if (applySearchUrlFilter) {
            textUrl = decodeURIComponent(li.articleUrl.split('/').at(-1)).replaceAll('_',' ');
            if (!textUrl.toUpperCase().includes(searchUrlInput.value.toUpperCase()) )
                inds[i] = -1;
        }
        if (applyCategoryFilter)
            if ( !li.category.includes(categorySelect.value) ) 
                inds[i] = -1;
        if (applySearchTextFilter) {
            text = searchTextInput.value.toUpperCase();
            if (inds[i] != -1) {
                if (urlDiffs.get(li.articleUrl) == null) {
                    adiffs = await query('diffsFromUrl',li.articleUrl,null);
                    urlDiffs.set(li.articleUrl,adiffs);
                }
                diffs = urlDiffs.get(li.articleUrl);
                for (let j=0; j<diffs.length; j++) {
                    badJSON = false;
                    try {
                        obj = JSON.parse(diffs[j].changes);
                    } catch (e) {
                        badJSON = true;
                        console.log('error en json en la diferencia',diffs[j].id,' del artículo ',diffs[j].articleUrl )
                    }
                    if (!badJSON) {
                        for (let k=0; k<obj.length; k++) {
                            for (let l=0; l<obj[k].change.length; l++) {
                                aux = obj[k].change[l].add;
                                if ( (typeof(aux) =='object' && Object.keys(aux).length > 0 ) || (typeof(aux) =='string' && aux.length > 0 ) ) {
                                    aux = typeof(aux) =='object'? aux.text.toUpperCase() : aux.toUpperCase();
                                    if (aux.replaceAll('$$+BEGIN+$$','').replaceAll('$$+END+$$','').includes(text))
                                        ids.add(diffs[j].id+"");
                                }
                                aux = obj[k].change[l].del;
                                if ( (typeof(aux) =='object' && Object.keys(aux).length > 0 ) || (typeof(aux) =='string' && aux.length > 0 ) ) {
                                    aux = typeof(aux) =='object'? aux.text.toUpperCase() : aux.toUpperCase();
                                    if (aux.replaceAll('$$-BEGIN-$$','').replaceAll('$$-END-$$','').includes(text))
                                        ids.add(diffs[j].id+"");
                                }
                            }
                        }
                    }
                }
                if (ids.size > 0)
                    urlIds.set(li.articleUrl,Array.from(ids));
                else
                    inds[i] = -1;
            }
        }
        if (applyDateFilter) {
            if (inds[i] != -1) {
                lidates = li.dates;
                if (urlIds.get(li.articleUrl) != undefined) 
                    lidates = li.dates.filter(obj => urlIds.get(li.articleUrl).includes(obj.id));
                for (let j=0; j<lidates.length; j++) {
                    [d,m,y] = lidates[j].date.split('/');
                    date = new Date(y,(Number.parseInt(m)-1),d);
                    if (beginDate != "" && endDate == "")  // [begin,inf)
                        date >= beginDate? ids.add(lidates[j].id) : ids.delete(lidates[j].id);
                    else if (beginDate == "" && endDate != "")  // (-inf,end] 
                        date <= endDate? ids.add(lidates[j].id) : ids.delete(lidates[j].id);
                    else if (beginDate != "" && endDate != "")  // [begin,end] 
                        date >= beginDate && date <= endDate? ids.add(lidates[j].id) : ids.delete(lidates[j].id);
                }
                if (ids.size > 0) 
                    urlIds.set(li.articleUrl,Array.from(ids));
                else
                    inds[i] = -1;
            }
        }
    }
    if (inds.includes(-1)) {
        for (let i=0; i<urlData.length; i++) {
            if (inds[i] != -1) {
                if (urlIds.get(urlData[i].articleUrl) != null) {
                    urlData[i].articleUrlDiffs = urlIds.get(urlData[i].articleUrl);
                    if (applySearchTextFilter)
                        urlData[i].articleUrlDiffs.push('search:'+text);
                }
                filteredUrlData.push(urlData[i]);
            }
        }
    }
    else
        filteredUrlData = urlData;

    if (e != undefined) {
        storageObj.pager.page = 0;
        currentPage = 1;
        sessionStorage.setItem('listby',JSON.stringify(storageObj));
    }
    title.innerText= filteredUrlData.length + titleText;

    if (searchTextInput != null)
        if (searchTextInput.disabled == true)
            searchTextInput.disabled = false;
    liLinks();
}

function pager(evt) {
    if (evt.type == 'click') {
        if (evt.target.classList.contains('prevPage')) {
            currentPage -= 1; 
            storageObj.pager.page -= 1;
        } else {
            currentPage += 1;
            storageObj.pager.page += 1;
        }
        pagerInput.value = currentPage;
        sessionStorage.setItem('listby',JSON.stringify(storageObj));
        liLinks();
    } else {
        debounce = setTimeout(() => {
            let val = Number.parseInt(pagerInput.value);
            if (isNaN(val) || val < 1 || val > totalPages || val == (storageObj.pager.page+1)) {
                pagerInput.value = storageObj.pager.page+1;
            } else {
                
                pagerInput.value = val;
                currentPage = val;
                storageObj.pager.page = currentPage-1; 
                sessionStorage.setItem('listby',JSON.stringify(storageObj));
                liLinks();
            }
        },700);
    }
   nextBtn.disabled = currentPage == totalPages? true : false;
   prevBtn.disabled = currentPage == 1? true : false;
}
</script>
