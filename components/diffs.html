<style>
#diffs {
    padding-left:10%;
    width: 80%;

}
.diff-header {
    background-color: aquamarine; /**/
    display: grid;
    grid-template-areas: 
    "0 A B C";
    grid-template-columns: 1fr 1fr 1fr 2fr;                
}            
#datetime { grid-area: A; }
#user { grid-area: B; }
#article-url { grid-area: C; }

.lineno {
    margin-top: 0.5rem;
    padding: 0.1rem 0rem 0.2rem 0.2rem;
    border: solid 1px rgb(242, 242, 242);
    display:inherit;
}
.addel-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
}
.add {
    grid-column: 2;
    margin: 0rem 0 0 0;
    padding: 0 0 0 0.5rem;
    border: solid 1px rgb(242, 242, 242);
    background-color: rgb(199, 255, 186);
}
.del {
    grid-column: 1;
    margin: 0rem 0 0 0;
    padding: 0 0 0 0.5rem;
    border: solid 1px rgb(242, 242, 242);
    background-color: rgb(253, 145, 145); /*TODO pick right colors*/
}

@media (max-width: 430px) {
    #diffs {
        padding-left: 0%;
        width: 100%;
        
    }
    .diff-header {
        width: 100%;
        display: grid;
        grid-template-areas: 
        "0 A B"
        "0 C C"; 
        grid-template-columns: 0.1fr 1.3fr 1fr;
        padding-bottom: 0.6rem;
    }
    .lineno {    
        padding: 0.1rem 0rem 0.2rem 0rem;
        border: solid 1px rgb(242, 242, 242);
    }
    .addel-content {
        display: grid;
        grid-template-columns: 1fr;
    }
    .add {
        grid-column: 1;
    }
    .del {
        grid-column: 1;
    }
    .fixed {
        position:fixed;
        top: 0 !important;
    }
    .wrap-diff-header:first-child {
        padding-left:60px;
    }
}
</style>
<div id="diffs">
<!-- JS generated -->       
</div>
<script>
    
    var diffsData = [];
    var diffTexts = [];
    diffHeaders = document.getElementsByClassName('diff-header')
    webHeader = document.getElementById('web-header')
    if (diffHeaders.length > 0) {
        currentDiffHeader = diffHeaders[diffHeaders.length-1]
    }  
    const observer = new IntersectionObserver(
        ([entry]) => {
            if (!entry.isIntersecting) 
                currentDiffHeader.classList.add('fixed');
            else 
                currentDiffHeader.classList.remove('fixed')                        
        })
    observer.observe(webHeader)
</script>
