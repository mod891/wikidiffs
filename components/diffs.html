<style>
.diff-header {
    background-color: aquamarine; /**/
    display: grid;
    grid-template-areas: 
    "0 A B C";
    grid-template-columns: 1fr 1fr 1fr 2fr;                
}            
#datetime { grid-area: A; }
#user { grid-area: B; }
#article-url { grid-area: C; }

.lineno {
    margin-top: 0.5rem;
    padding: 0.1rem 0rem 0.2rem 0.2rem;
    border: solid 1px rgb(242, 242, 242);
    display:inherit;
}
.lineno-data {
    text-align:center;
}
.addel-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
}
.add {
    grid-column: 2;
    margin: 0rem 0 0 0;
    padding: 0 0 0 0.5rem;
    border: solid 1px rgb(242, 242, 242);
    background-color: rgb(199, 255, 186);
}
.del {
    grid-column: 1;
    margin: 0rem 0 0 0;
    padding: 0 0 0 0.5rem;
    border: solid 1px rgb(242, 242, 242);
    background-color: rgb(253, 145, 145); /*TODO pick right colors*/
}

@media (max-width: 430px) {
    .wrap-diff-header {
        padding-top: 2rem;
    }
    .diff-header {
        width: 100%;
        display: grid;
        grid-template-areas: 
        "0 A B"
        "0 C C"; 
        grid-template-columns: 0.1fr 1.3fr 1fr;
        padding-bottom: 0.6rem;
    }
    .lineno {    
        padding: 0.1rem 0rem 0.2rem 0rem;
        border: solid 1px rgb(242, 242, 242);
    }
    .addel-content {
        display: grid;
        grid-template-columns: 1fr;
    }
    .add {
        grid-column: 1;
    }
    .del {
        grid-column: 1;
    }
    .fixed {
        position:fixed;
        top: 0 !important;
    }
    
    .wrap-diff-header:first-child {
        padding-left:60px;
    }
}
</style>

<div id="diffs"></div>

<script>

var idCont = 0;
var diffTexts = [];
loadDiffs()

async function loadDiffs() {

    var articleUrl = diffUrl;
    var dataRequest = null;

     try {
        if (articleUrl == "")
            data = await fetch(`/public/js/db/mock-sample1.json`).then(res => res.json()); // remote db query
        else
            data = await query('diffsFromUrl',articleUrl);
    } catch (err) {
        console.log(`mockDiffs::data retrieving Error:`,err);
    }
    if (data.length > 0) {
        var fragment = null;
        for (let d=0; d<data.length; d++) {
            currentDiff = data[d];
            articleTitle = currentDiff.articleUrl.split('/').at(-1).replaceAll('_',' ')
            diffHeader =`
            <div id="{DIFFID}" class="diff">
                <div class="wrap-diff-header">
                    <div class="diff-header">
                        <span id="datetime">
                            <label class="mr05">Fecha</label><b id="datetime-data">${currentDiff.datetime}</b></span>
                        <span id="user">
                            <label class="mr05">por</label><b id="user-data"><a href="#">${currentDiff.user}</a></b></span> 
                        <span id="article-url">
                            <a id="article-url-data" href="${currentDiff.diffUrl}">${articleTitle}</a></span>
                </div></div>
                <div class="lines"></div>
            </div>` 
                        
            fragment = document.createElement('template');
            fragment.innerHTML = diffHeader;
            changes = JSON.parse(currentDiff.changes) 

            for (let i=0; i<changes.length; i++) {
                change = changes[i];
                lineno = `<div class="lineno">
                            <div class="lineno-data">
                                <label class="ml05r">linea <b>${change.lineno}</b></label>
                            </div><div class="addel-content"></div>`
                
                fragment.content.querySelectorAll('.lines')[fragment.content.querySelectorAll('.lines').length-1].innerHTML += lineno
                for (let j=0; j<change.change.length; j++) {
                    addels = change.change[j]
                    addelDiv = fragment.content.querySelectorAll('.addel-content')[fragment.content.querySelectorAll('.addel-content').length-1]
                    collapsableDiv().forEach(item => diffTexts.push(item))
                }
            }
            document.getElementById(`diffs`).insertAdjacentHTML('beforeend',fragment.innerHTML)
        }
        document.head.appendChild(script);
    }        
}
function collapsableDiv() {
    var objStruct = {
        id: '',
        shortText: '',
        fullText: '',
    };
    var objs = [];
    keys = Object.keys(addels)
    for (i in keys) {
        if (Object.keys(addels[keys[i]]).length > 0) {
            obj = { ...objStruct}
            idCont++;
            if (addels[keys[i]].hasOwnProperty('text')) 
                text = escapeHTML(addels[keys[i]].text)
            else 
                text = escapeHTML(addels[keys[i]])
            
            obj.id = "text"+idCont 
            if (text.length > 300) {
                obj.shortText = text.substr(0,300)+"... <a href='#' onClick='changeText(event,this)'><b>{más}</b></a>";
                obj.fullText = text+" <a href='#' onClick='changeText(event,this)'><b>{menos}</b></a>";
            } else {
                obj.shortText = text;
                obj.fullText = null;
            }
            addelDiv.innerHTML += `<div id="text${idCont}" class="${keys[i]}"><p>${obj.shortText} </p></div>`
            objs.push(obj)
        }
    }
    return objs;
}
function escapeHTML(str) {
    return str.replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}
function changeText(event,obj) {
    event.preventDefault();
    console.log(event,obj)
    div = obj.parentElement.parentElement
    if (obj.textContent == '{menos}') {
        diffTexts.map( (it) =>  {
            if (it.id == div.id) 
                div.children[0].innerHTML = it.shortText            
        })
    } else {
        diffTexts.map( (it) =>  {
            if (it.id == div.id) 
                div.children[0].innerHTML = it.fullText
        })         
    }
}
</script>
