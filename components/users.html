<style>

.link {
    margin-right:auto;
    display: flex;
    align-items: center;
}
 .link > a {
    margin-right: auto;
    max-width: 70%;
    overflow: hidden;
    text-overflow: ellipsis;
} 
.grid-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    align-items: center;    
}
#title {
    text-align: center;
}
.grid-content {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    margin-left: 1rem;
}
.grid-content > li {
    white-space: nowrap;
    overflow: hidden;
    max-width: 85%;
} 
.users {
    align-content: center;
    grid-column: 2;
}
.filter {
    align-content: center;
    grid-column: 3;
}
.filter input {    
    text-align: center;
    box-shadow: 2px 2px 3px var(--black);
}


@media (max-width: 1400px) and (orientation: landscape), (max-width: 1400px) and (orientation:portrait) { 
    .grid-header {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr ;
        align-items: center;    
    }
    .grid-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }
    .users {
        align-content: center;
        grid-column: 2;
    }
    .filter {
        align-content: center;
        grid-column: 2;
        margin-bottom: 1rem;
        transform: translateY(-10px);

    }
    .link {
        margin-right: 1rem;
    }
    #header {
        position: sticky;
        top: 0;
    }
}
</style>
<div id="users">
    <div>
        <div id="header" class="bg-blue2">
            <div class="grid-header">
                <div class="users">
                    <h3 id="title"></h3>
                </div>
                <div class="filter">
                    <input type="text" name="" placeholder="filtrar" id="search">
                </div>
            </div>
        </div>
        
        <div id="users-content">

        </div>
        <div class="dflex pager mb1">
            <div class="dflex">
                <button class="prevPage"><label class="prevPage"> < </label></button>
                <input class="currentPageInput" class="" type="text" value="">
                <label class="pr1">de </label>
                <label class="totalPages"></label>
                <button class="nextPage"><label class="nextPage"> > </label></button>
            </div>
        </div>
    </div>
</div>

<script>
var storageObj = null, userData = null;
var filteredUserData = null, debounce = null;
var nUsers = document.getElementById('title')
var pagerInput = document.querySelector('.currentPageInput');
var searchInput = document.getElementById('search');
var currentPage = 1, perPage = 50, totalPages = 0;
var btns = document.querySelectorAll('button');
var prevBtn = btns[0], nextBtn = btns[1];

init();

async function init() {
    freezeGUI('Cargando usuarios...');
    document.getElementById('search').addEventListener('input', async (e) => {
        clearTimeout(debounce);
        debounce = setTimeout(() => { filterData(e); }, 300);
    });
    btns.forEach( btn => btn.addEventListener('click',pager));
    pagerInput.addEventListener('input',pager);
    storageObj = JSON.parse(sessionStorage.getItem('users'));
    if (storageObj != null) {
        userData = storageObj['users'];
        if (storageObj.filter.length > 0) 
            searchInput.value = storageObj.filter;
        if (storageObj.pager.page > 0) 
            pagerInput.value = storageObj.pager.page+1;
        if (storageObj.filter.length + storageObj.pager.page > 0)   
            filterData();
    } else {
        await fetchUsers();
    }
    liLinks();
    freezeGUI(false);
}

function liLinks() {
    var div = document.getElementById('users-content');
    var users = userData;
    freezeGUI('Cargando usuarios...');
    if (filteredUserData != null) 
        users = filteredUserData;
    nUsers.innerText =`${users.length} Usuarios`;
    pagerInput.value = storageObj.pager.page+1;
    totalPages = Number.parseInt((users.length/perPage));
    if (String(users.length/perPage).includes('.'))
        totalPages++;
    document.querySelector('.totalPages').textContent = totalPages;
    nextBtn.disabled = storageObj.pager.page+1 == totalPages? true : false;
    prevBtn.disabled = storageObj.pager.page+1 == 1? true : false;
    var ul = document.createElement('ul');
    ul.classList = 'grid-content';

    if (users.length <= perPage)
        document.querySelector('.pager').style.display = 'none';
    else 
        document.querySelector('.pager').style.display = 'flex';

    if (users.length > 0) {
        let endFor = storageObj.pager.page+1 == totalPages? users.length : (storageObj.pager.page)*perPage+perPage;
        for (let i=(storageObj.pager.page)*perPage; i<endFor; i++) {
            var li = `<li data-prevuser="${users[i].user}">
                        <div class="link">
                            <a href="#diffs?diff=user::${users[i].user}">${users[i].user}</a>
                            <label title="nº de ediciones" class="n-editions">${users[i].nedits}</label>
                        </div>
                    </li>`;    
            ul.insertAdjacentHTML('beforeend',li);
        }
    }
    div.appendChild(document.createElement('div'));
    if (div.querySelector('ul') != null)
        div.querySelector('ul').remove();
    div.lastChild.appendChild(ul);
    freezeGUI(false);
}

async function fetchUsers() {
    var rawData = await query('prevUsers');
    var users = [];
    for (i in rawData) {
        let user = rawData[i].prevUser;
        if (user.split('&').length > 1)
            user = user.split('&')[0];
        users.push({
            user:user,
            nedits:rawData[i].nedits
        });
    }
    storageObj = { 
        users,
        pager: {
            page:0,
            perPage:perPage
        },
        filter: ''
    };
    sessionStorage.setItem('users',JSON.stringify(storageObj));
    userData = users;
}

function filterData(e) {
    filteredUserData = [];
    let inds = [];
    let nVisibles = userData.length;
    var applySearchFilter = false;

    if (searchInput != null) {
        if (searchInput.value != '') {
            applySearchFilter = true;
            storageObj.filter = searchInput.value;
        }
        else
            storageObj.filter = '';
    }
    userData.forEach( (obj,i) => {
        if (applySearchFilter) {
            if (!obj.user.toUpperCase().includes(searchInput.value.toUpperCase()) ) 
                inds[i] = -1;
        }
    });
    for (let i=0; i<userData.length; i++)
        if (inds[i] != -1)
            filteredUserData.push(userData[i]);
    if (e != undefined)
        storageObj.pager.page = 0;

    nUsers.innerText= filteredUserData.length + " usuarios";
    sessionStorage.setItem('users',JSON.stringify(storageObj));
    liLinks();
}

async function pager(evt) {
    if (evt.type == 'click') {
        if (evt.target.classList.contains('prevPage')) 
            storageObj.pager.page -= 1;
        else
            storageObj.pager.page += 1;
        pagerInput.value = storageObj.pager.page+1;
        sessionStorage.setItem('users',JSON.stringify(storageObj));
        liLinks();
    } else {
        clearTimeout(debounce);
        debounce = setTimeout(() => {
            let val = Number.parseInt(pagerInput.value);
            if (isNaN(val) || val < 1 || val > totalPages || val == (storageObj.pager.page+1)) {
                pagerInput.value = storageObj.pager.page+1;
            } else {
                pagerInput.value = val;
                storageObj.pager.page = val-1;
                sessionStorage.setItem('users',JSON.stringify(storageObj));
                liLinks();
            }
        },999);
    }
    nextBtn.disabled = storageObj.pager.page+1 == totalPages? true : false;
    prevBtn.disabled = storageObj.pager.page+1 == 1? true : false;
}
</script>
