<!DOCTYPE html>

    <head>

        <div id="container">
            <div class="justify-center d-dflex">

                <div id="menu-fragment"></div>

                    version="1.1"
                    id="svg1"
                    xmlns="http://www.w3.org/2000/svg"
                    xmlns:svg="http://www.w3.org/2000/svg">
                <defs
                    id="defs1" />
                <g
                    id="layer1"
                    transform="translate(-90.472765,-37.808514)">
